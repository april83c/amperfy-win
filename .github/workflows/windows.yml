name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core
        run: dotnet test windows/tests/Amperfy.Core.Tests/Amperfy.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  integration:
    # Core end-to-end tests (login, sync, browse, download, streaming) against a live Navidrome server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start Navidrome with the test library
        run: ./windows/scripts/start-navidrome-docker.sh windows/tests/TestLibrary 4533 admin amperfy-test
      - name: Integration tests
        env:
          AMPERFY_IT_SERVER: http://127.0.0.1:4533
          AMPERFY_IT_USER: admin
          AMPERFY_IT_PASSWORD: amperfy-test
        run: dotnet test windows/tests/Amperfy.Core.Tests/Amperfy.Core.Tests.csproj -c Release --filter "FullyQualifiedName~Integration" --logger "console;verbosity=normal"
      - name: Navidrome log
        if: failure()
        run: docker logs navidrome | tail -100

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish app (x64)
        run: dotnet publish windows/src/Amperfy.App/Amperfy.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/Amperfy-win-x64
      - name: List published files
        shell: pwsh
        run: Get-ChildItem out/Amperfy-win-x64 -Recurse -File | Where-Object { $_.Extension -in '.pri','.xbf' -or $_.Name -like 'Amperfy*' } | Format-Table FullName, Length -AutoSize
      - name: Smoke test (launch + screenshot)
        shell: pwsh
        run: ./windows/scripts/smoke-test.ps1 -ExePath out/Amperfy-win-x64/Amperfy.exe -OutDir out/smoke
      - name: Install a virtual audio device (the runner has none; needed for playback)
        uses: LABSN/sound-ci-helpers@v1
      - name: E2E screenshot tour against Navidrome (login, sync, all pages)
        shell: pwsh
        env:
          AMPERFY_DATA_DIR: ${{ github.workspace }}\out\e2e-data
          AMPERFY_E2E_SERVER: http://127.0.0.1:4533
          AMPERFY_E2E_USER: admin
          AMPERFY_E2E_PASSWORD: amperfy-test
        # Navidrome must be started in the same step: the runner kills processes left over by a finished step.
        run: |
          ./windows/scripts/start-navidrome.ps1 -MusicDir windows/tests/TestLibrary -WorkDir out/navidrome
          ./windows/scripts/smoke-test.ps1 -ExePath out/Amperfy-win-x64/Amperfy.exe -OutDir out/tour -Arguments "--screenshot-tour `"${{ github.workspace }}\out\tour`"" -ExitTimeoutSeconds 600
      - name: Upload tour results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-results
          path: |
            out/tour
            out/navidrome/*.log*
            out/e2e-data/logs
          retention-days: 7
      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-win-x64
          path: out/Amperfy-win-x64
          retention-days: 14
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: out/smoke
          retention-days: 7
