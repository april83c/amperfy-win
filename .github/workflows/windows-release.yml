name: Windows release

# Builds self-contained x64 and ARM64 packages (zip) and attaches them to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. win-v2.0.0)'
        required: true
  push:
    tags: ['win-v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish windows/src/Amperfy.App/Amperfy.App.csproj -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }} -o out/Amperfy
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/Amperfy/* -DestinationPath out/Amperfy-win-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Amperfy-win-${{ matrix.arch }}
          path: out/Amperfy-win-${{ matrix.arch }}.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Amperfy for Windows $TAG" --notes "Self-contained build. Unzip and run Amperfy.exe (Windows 10 version 2004 or later, Windows 11)."
