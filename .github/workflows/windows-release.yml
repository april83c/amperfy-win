name: Windows release

# Every pushed tag (e.g. v2.0.1) builds the Windows app for x64 and ARM64, packs it with Velopack
# (installer, portable zip, full + delta update packages) and publishes a GitHub release. The
# release is also the update feed of the installed apps (Velopack GithubSource, one channel per
# architecture: win-x64, win-arm64). Tags with a suffix (v2.1.0-beta.1) become pre-releases.
# It can also be started manually (Actions > Windows release > Run workflow) with a tag name; the
# release (and its tag) is then created on the current commit of the selected branch.
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v2.0.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.158

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Version from tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not a semantic version (expected e.g. v2.0.1)" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$([int]($version -match '-'))" >> $env:GITHUB_ENV
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
      - name: Build and pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          $notes = "release-notes.md"
          @"
          Amperfy for Windows $env:VERSION

          **Install:** download ``AmperfyWin-win-x64-Setup.exe`` (or ``AmperfyWin-win-arm64-Setup.exe`` for ARM devices) and run it. The installer sets up the .NET 10 Runtime if needed, and Amperfy updates itself when a new version is released.

          **Portable:** ``AmperfyWin-win-x64-Portable.zip`` / ``AmperfyWin-win-arm64-Portable.zip``.

          Unofficial port, not affiliated with the original Amperfy project: please report issues here, not upstream.
          "@ | Set-Content $notes
          foreach ($arch in 'x64', 'arm64') {
            $platform = if ($arch -eq 'x64') { 'x64' } else { 'ARM64' }
            dotnet publish windows/src/Amperfy.App/Amperfy.App.csproj -c Release -r win-$arch -p:Platform=$platform -p:Version=$env:VERSION -o publish/$arch
            if ($LASTEXITCODE -ne 0) { throw "publish $arch failed" }
            # previous release of the channel (for delta packages); fails harmlessly for the first release
            vpk download github --repoUrl $repo --token $env:GH_TOKEN --channel win-$arch -o releases/$arch
            $global:LASTEXITCODE = 0
            # packId AmperfyWin: installs to %LOCALAPPDATA%\AmperfyWin, separate from the app data in %LOCALAPPDATA%\Amperfy
            vpk pack --packId AmperfyWin --packVersion $env:VERSION --packDir publish/$arch --mainExe Amperfy.exe `
              --packTitle Amperfy --packAuthors "Amperfy for Windows" --icon windows/src/Amperfy.App/Assets/AppIcon.ico `
              --channel win-$arch --runtime win-$arch --framework net10-$arch-runtime --releaseNotes $notes -o releases/$arch
            if ($LASTEXITCODE -ne 0) { throw "pack $arch failed" }
          }
          Get-ChildItem releases -Recurse -File | Format-Table FullName, Length -AutoSize
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          $extra = @()
          if ($env:PRERELEASE -eq '1') { $extra += '--pre' }
          foreach ($arch in 'x64', 'arm64') {
            vpk upload github --repoUrl $repo --token $env:GH_TOKEN --channel win-$arch -o releases/$arch `
              --publish --merge @extra --releaseName "Amperfy for Windows $env:VERSION" --tag $env:RELEASE_TAG --targetCommitish "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "upload $arch failed" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velopack-releases
          path: releases
          retention-days: 7
